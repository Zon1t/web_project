<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랭킹 | 슥밥</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/app-header.css">
  <link rel="stylesheet" href="/css/ranking.css">
</head>
<body>
  <!-- ① 공통 헤더 (S-01과 동일, '랭킹' 메뉴 강조) -->
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__logo" href="/">슥밥</a>
      <nav class="app-header__nav" aria-label="주 메뉴">
        <a class="app-header__link" href="/">구내식당</a>
        <a class="app-header__link" href="/restaurant-list.html">식당</a>
        <a class="app-header__link" href="/party-list.html">식사팟</a>
        <a class="app-header__link is-active" href="/ranking.html" aria-current="page">랭킹</a>
      </nav>
      <div class="app-header__user">
        <a id="header-nickname" class="app-header__nickname" href="/mypage.html" hidden></a>
        <button id="header-logout" class="btn" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="container ranking-page">
    <!-- ② 랭킹 기준 안내 -->
    <div class="ranking-head">
      <h1 class="page-title">이달의 따봉 랭킹 TOP 10</h1>
      <p id="ranking-period" class="ranking-head__desc">
        최근 30일 따봉 수 기준 · 동점 시 리뷰 수가 많은 순
      </p>
    </div>

    <!-- ③ 랭킹 목록 / 로딩 / 빈 상태 / 오류 -->
    <div id="ranking-body" aria-live="polite"></div>
  </main>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api/auth.js"></script>
  <script src="/js/api/restaurant.js"></script>
  <script src="/js/api/ranking.js"></script>
  <script src="/js/components/app-header.js"></script>
  <script src="/js/pages/ranking.js"></script>
</body>
</html>
