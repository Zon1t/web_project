<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>식사팟 상세 | 슥밥</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/party-detail.css">
</head>
<body>
  <!-- 임시 헤더: 공통 헤더가 확정되면 교체 (B의 header.css) -->
  <header class="app-header">
    <div class="app-header__inner">
      <a class="app-header__logo" href="/">슥밥</a>
      <nav class="app-header__nav" aria-label="주 메뉴">
        <a class="app-header__link" href="/">구내식당</a>
        <a class="app-header__link" href="/restaurant-list.html">식당</a>
        <a class="app-header__link is-active" href="/party-list.html" aria-current="page">식사팟</a>
        <a class="app-header__link" href="#">랭킹</a>
      </nav>
    </div>
  </header>

  <main class="container party-detail-page">
    <nav class="party-breadcrumb text-muted" aria-label="현재 위치">
      <a href="/party-list.html">식사팟 목록</a> &gt; 식사팟 상세
    </nav>

    <div class="party-layout">
      <!-- 왼쪽: 제목·상태, 일정, 내 버튼, 참여자, 방장 메뉴 (로딩 / 없는 팟 / 오류도 여기) -->
      <div id="party-root" class="party-main"></div>

      <!-- 오른쪽: 대화 (참여자만) -->
      <section id="chat-root" class="party-chat" aria-labelledby="chat-title" hidden>
        <div class="party-chat__head">
          <h2 id="chat-title" class="party-chat__title">대화</h2>
          <span class="text-muted">식사 완료 후 읽기 전용 · 다음 날 삭제</span>
        </div>
        <div id="chat-body" class="party-chat__body" aria-live="polite"></div>
        <form id="chat-form" class="party-chat__form" novalidate>
          <label for="chat-input" class="sr-only">메시지 입력</label>
          <input id="chat-input" class="input" maxlength="200" autocomplete="off" placeholder="메시지를 입력하세요">
          <button type="submit" class="btn btn--primary">전송</button>
        </form>
        <p id="chat-message" class="field__message field__message--error party-chat__error" role="alert"></p>
      </section>
    </div>
  </main>

  <!-- 방장의 일정 확정·수정 창 -->
  <dialog id="schedule-dialog" class="party-dialog" aria-labelledby="schedule-title">
    <form id="schedule-form" class="party-dialog__form" method="dialog" novalidate>
      <h2 id="schedule-title" class="section-title">일정 확정</h2>
      <p id="schedule-notice" class="party-dialog__notice" hidden>
        일정을 바꾸면 방장을 포함한 모든 참여자의 확정이 초기화됩니다. 다시 확정을 받아야 합니다.
      </p>
      <div class="field">
        <label class="field__label" for="schedule-time">확정 시간</label>
        <select id="schedule-time" class="select"></select>
      </div>
      <div class="field">
        <label class="field__label" for="schedule-place">만날 장소</label>
        <input id="schedule-place" class="input" maxlength="30" placeholder="예: 1층 로비">
        <p class="field__message">최대 30자</p>
      </div>
      <div class="field">
        <label class="field__label" for="schedule-memo">메모 (선택)</label>
        <input id="schedule-memo" class="input" maxlength="50" placeholder="예: 늦으면 채팅 남겨 주세요">
        <p class="field__message">최대 50자</p>
      </div>
      <p id="schedule-message" class="field__message field__message--error" role="alert"></p>
      <div class="party-dialog__actions">
        <button type="button" class="btn" data-action="close-dialog">취소</button>
        <button type="submit" class="btn btn--primary" id="schedule-submit">저장</button>
      </div>
    </form>
  </dialog>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api/restaurant.js"></script>
  <script src="/js/api/party.js"></script>
  <script src="/js/pages/party-detail.js"></script>
</body>
</html>
