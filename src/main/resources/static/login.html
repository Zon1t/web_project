<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 | 슥밥</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body>
  <!-- 공통 헤더: js/components/app-header.js가 그린다 -->
  <header id="app-header" class="app-header" data-variant="simple"></header>

  <main class="auth-page">
    <section class="auth-card" aria-labelledby="login-title">
      <h1 id="login-title" class="auth-card__title">로그인</h1>
      <p class="auth-card__desc">슥밥은 로그인 후 이용할 수 있어요.</p>

      <form id="login-form" class="auth-form" novalidate>
        <!-- 가입 완료 안내 / 로그인 실패 문구 -->
        <p id="login-notice" class="auth-notice" role="alert" hidden></p>

        <div class="field">
          <label class="field__label" for="login-id">아이디</label>
          <input id="login-id" class="input" type="text" name="loginId"
                 maxlength="20" autocomplete="username" autocapitalize="off" spellcheck="false">
        </div>

        <div class="field">
          <label class="field__label" for="login-password">비밀번호</label>
          <input id="login-password" class="input" type="password" name="password"
                 maxlength="20" autocomplete="current-password">
        </div>

        <button id="login-submit" class="btn btn--primary auth-submit" type="submit">로그인</button>
      </form>

      <p class="auth-card__footer">
        아직 계정이 없나요? <a href="/signup.html">회원가입</a>
      </p>
    </section>
  </main>

  <!-- 공통 푸터: js/components/app-footer.js가 그린다 -->
  <footer id="app-footer" class="app-footer"></footer>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api/auth.js"></script>
  <script src="/js/components/brand.js"></script>
  <script src="/js/components/app-header.js"></script>
  <script src="/js/components/app-footer.js"></script>
  <script src="/js/pages/login.js"></script>
</body>
</html>
