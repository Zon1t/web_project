spring:
  application:
    name: sseukbap
  profiles:
    active: local
  jpa:
    database-platform: org.hibernate.community.dialect.OracleLegacyDialect
    hibernate:
      ddl-auto: none          # 테이블은 docs/sql의 DDL 스크립트로 생성
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true
  servlet:
    multipart:
      max-file-size: 5MB      # 리뷰 사진 1장 (F-09)
      max-request-size: 6MB

server:
  port: 8081                  # Oracle XE 11g가 8080을 사용하므로 변경
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:                  # 2026-11-24 (C1) 세션 설정 명시
      timeout: 60m            # 아무것도 안 하고 60분 지나면 로그아웃 (발표 중 풀리지 않게)
      cookie:
        http-only: true       # JS에서 세션 쿠키를 읽지 못하게
        same-site: lax        # 다른 사이트에서 보낸 요청에는 쿠키를 붙이지 않음

upload:
  dir: uploads # 업로드 파일 저장 폴더 (프로젝트 폴더 기준, Git 제외)

restaurant:
  register-radius-km: 4 # 식당 등록 가능 거리: 회사(구내식당 좌표)에서 반경 km (2026-11-24)
  search-area: 광진구     # 반경 안 후보가 없을 때 식당 이름 뒤에 붙여 한 번 더 검색할 회사 지역 (2026-11-25)

