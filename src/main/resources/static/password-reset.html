<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>비밀번호 찾기 | 슥밥</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/auth.css">
  <link rel="stylesheet" href="/css/password-field.css">
</head>
<body>
  <!-- 공통 헤더: js/components/app-header.js가 그린다 -->
  <header id="app-header" class="app-header" data-variant="simple"></header>

  <!-- 비밀번호 찾기 (C, 2026-11-24): 한 화면에서 차례로
       1) 아이디·회사 이메일 → [인증번호 받기]  2) 인증번호 → [인증번호 확인]  3) 새 비밀번호 → [비밀번호 바꾸기]
       실제 메일은 보내지 않는다. 인증번호는 서버 콘솔(LogMailSender)에 찍힌다 -->
  <main class="auth-page">
    <section class="auth-card auth-card--single" aria-labelledby="reset-title">
      <a class="ui-back" href="/login.html" data-ui-back><span data-ui-icon="chevronRight" data-size="16"></span>로그인으로</a>
      <h1 id="reset-title" class="auth-card__title">비밀번호 찾기</h1>
      <p class="auth-card__desc">아이디와 가입할 때 등록한 회사 이메일을 입력하면 인증번호를 보내 드려요.</p>

      <p id="reset-notice" class="auth-notice" role="alert" hidden></p>

      <form id="reset-form" class="auth-form" novalidate>
        <!-- 1) 아이디 + 회사 이메일 -->
        <div class="field">
          <label class="field__label" for="reset-id">아이디</label>
          <input id="reset-id" class="input" type="text" maxlength="20" autocomplete="username"
                 autocapitalize="off" spellcheck="false" aria-describedby="reset-id-message">
          <p id="reset-id-message" class="field__message" aria-live="polite"></p>
        </div>

        <div class="field">
          <label class="field__label" for="reset-email">회사 이메일</label>
          <input id="reset-email" class="input" type="email" maxlength="100" autocomplete="email"
                 placeholder="name@samsung.com" aria-describedby="reset-email-message">
          <p id="reset-email-message" class="field__message" aria-live="polite"></p>
        </div>

        <button id="request-submit" class="btn btn--primary auth-submit" type="button">인증번호 받기</button>

        <!-- 2) 인증번호 (번호를 받은 뒤에 보임) -->
        <div id="code-step" class="auth-step" hidden>
          <div class="field">
            <label class="field__label" for="reset-code">인증번호</label>
            <div class="auth-field__row">
              <input id="reset-code" class="input" type="text" inputmode="numeric" maxlength="6"
                     autocomplete="one-time-code" placeholder="6자리 숫자" aria-describedby="reset-code-message reset-timer">
              <button id="verify-submit" class="btn" type="button">인증번호 확인</button>
            </div>
            <p id="reset-timer" class="field__message reset-timer" aria-live="off"></p>
            <p id="reset-code-message" class="field__message" aria-live="polite"></p>
          </div>
        </div>

        <!-- 3) 새 비밀번호 (인증번호 확인 뒤에 보임) -->
        <div id="password-step" class="auth-step" hidden>
          <div class="field">
            <label class="field__label" for="reset-new-password">새 비밀번호</label>
            <input id="reset-new-password" class="input" type="password" maxlength="20" autocomplete="new-password"
                   placeholder="영문·숫자를 함께 넣어 8~20자" aria-describedby="reset-new-password-message" data-password-field>
            <p id="reset-new-password-message" class="field__message" aria-live="polite"></p>
          </div>

          <div class="field">
            <label class="field__label" for="reset-new-password-confirm">새 비밀번호 확인</label>
            <input id="reset-new-password-confirm" class="input" type="password" maxlength="20" autocomplete="new-password"
                   aria-describedby="reset-new-password-confirm-message" data-password-field>
            <p id="reset-new-password-confirm-message" class="field__message" aria-live="polite"></p>
          </div>

          <button id="confirm-submit" class="btn btn--primary auth-submit" type="submit">비밀번호 바꾸기</button>
        </div>

        <p class="auth-help auth-help--note">회사 이메일을 등록하지 않았다면 관리자에게 문의해 주세요.</p>
      </form>
    </section>
  </main>

  <!-- 공통 푸터: js/components/app-footer.js가 그린다 -->
  <footer id="app-footer" class="app-footer"></footer>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api/auth.js"></script>
  <script src="/js/components/brand.js"></script>
  <script src="/js/components/ui.js"></script>
  <script src="/js/components/app-header.js"></script>
  <script src="/js/components/app-footer.js"></script>
  <script src="/js/components/password-field.js"></script>
  <script src="/js/pages/password-reset.js"></script>
</body>
</html>
