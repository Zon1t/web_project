<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>식당 등록 | 슥밥</title>
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/app-header.css">
  <link rel="stylesheet" href="/css/footer.css">
  <link rel="stylesheet" href="/css/ui.css">
  <link rel="stylesheet" href="/css/restaurant-register.css">
</head>
<body>
  <!-- 공통 헤더: js/components/app-header.js가 그린다 -->
  <header id="app-header" class="app-header"></header>

  <main class="container register-page">
    <a class="ui-back" href="/restaurant-list.html" data-ui-back><span data-ui-icon="chevronRight" data-size="16"></span>뒤로</a>
    <div class="ui-page-head">
      <div>
        <h1 class="ui-page-head__title">식당 등록</h1>
        <p class="ui-page-head__desc">알고 있는 맛집을 등록하면 모두가 지도에서 볼 수 있어요.</p>
      </div>
    </div>

    <form id="register-form" class="register-form" novalidate>
      <!-- 1. 네이버 지도 URL -->
      <div class="field">
        <label class="field__label" for="map-url">네이버 지도 URL <span class="register-form__required" aria-hidden="true">*</span></label>
        <div id="map-url-hint" class="url-guide">
          <p class="url-guide__title">링크 가져오는 방법</p>
          <ol class="url-guide__steps">
            <li><span><a href="https://map.naver.com" target="_blank" rel="noopener noreferrer">네이버 지도<span class="sr-only">(새 탭)</span></a>에서 식당 검색</span></li>
            <li><span>식당 정보에서 <strong>[공유]</strong></span></li>
            <li><span><strong>[링크 복사]</strong></span></li>
            <li><span>아래 칸에 붙여 넣기</span></li>
          </ol>
        </div>
        <input id="map-url" class="input" type="url" inputmode="url" autocomplete="off" required
               placeholder="https://naver.me/... 또는 https://map.naver.com/..." aria-describedby="map-url-hint map-url-error">
        <!-- URL 형식이 틀리면 바로 여기에 안내 (2026-11-25, restaurant-register.js checkUrlFormat) -->
        <p id="map-url-error" class="field__message field__message--error url-error" role="alert" hidden></p>
      </div>

      <!-- 2. 식당 이름 + 이미 등록된 비슷한 이름 -->
      <div class="field">
        <label class="field__label" for="restaurant-name">식당 이름 <span class="register-form__required" aria-hidden="true">*</span></label>
        <input id="restaurant-name" class="input" type="text" maxlength="30" autocomplete="off" required
               placeholder="예: OO국밥 세종대점" aria-describedby="name-hint">
        <p id="name-hint" class="field__message">이 이름으로 네이버에서 장소를 찾아요. 아래 후보 중 맞는 곳을 골라 주세요. 회사에서 4km 안의 음식점·카페만 등록할 수 있어요.</p>
        <div id="similar-names" class="similar-names" aria-live="polite"></div>
      </div>

      <!-- URL + 이름으로 찾은 장소 후보 (확인 결과, 2026-11-24: 후보 중 하나를 고른다) -->
      <div id="check-result" class="check-result" aria-live="polite"></div>

      <!-- 3. 카테고리 (구내식당은 등록 불가). 칩에 마우스를 올리면 음식 예시, 고르면 아래에 예시 -->
      <div class="field">
        <span class="field__label" id="category-label">카테고리 <span class="register-form__required" aria-hidden="true">*</span></span>
        <div id="category" class="category-picker chip-tips" role="radiogroup" aria-labelledby="category-label" aria-describedby="category-hint"></div>
        <p id="category-hint" class="field__message category-hint">후보를 고르면 네이버 분류로 카테고리를 미리 골라 둬요.</p>
      </div>

      <p id="form-message" class="field__message field__message--error" role="alert"></p>

      <div class="register-form__actions">
        <a class="btn" href="/restaurant-list.html">취소</a>
        <button id="submit-button" class="btn btn--primary" type="submit" disabled>등록하기</button>
      </div>
    </form>
  </main>

  <!-- 공통 푸터: js/components/app-footer.js가 그린다 -->
  <footer id="app-footer" class="app-footer"></footer>

  <script src="/js/api/client.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api/auth.js"></script>
  <!-- 백엔드 없이 확인하려면 아래 목업 줄의 주석을 푼다 -->
  <!-- <script src="/js/api/mock/restaurant.mock.js"></script> -->
  <script src="/js/api/restaurant.js"></script>
  <script src="/js/components/brand.js"></script>
  <script src="/js/components/ui.js"></script>
  <script src="/js/components/app-header.js"></script>
  <script src="/js/components/app-footer.js"></script>
  <script src="/js/pages/restaurant-register.js"></script>
</body>
</html>
